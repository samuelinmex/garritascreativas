<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página no encontrada | Garritas Creativas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Manrope:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{--coral:#ff6b61;--teal:#39b7b3;--deep:#124f59;--cream:#fff8ef}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,var(--cream),#fff);font-family:Manrope,sans-serif;color:var(--deep)}
    main{max-width:680px;text-align:center}.bubble{width:120px;height:120px;margin:0 auto 24px;display:grid;place-items:center;border-radius:38% 62% 57% 43%;background:#ffe4df;color:var(--coral);font:600 3rem Fraunces,serif}
    h1{font:600 clamp(2.5rem,8vw,5rem) Fraunces,serif;margin:0 0 12px}p{color:#637174;margin-bottom:28px}
    a{display:inline-flex;padding:13px 20px;border-radius:12px;background:var(--coral);color:white;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main>
    <div class="bubble">404</div>
    <h1>Esta página se nos escapó entre las garritas.</h1>
    <p>No encontramos lo que buscabas, pero puedes volver al inicio y seguir descubriendo nuestras creaciones.</p>
    <a href="/">Volver al inicio</a>
  </main>
</body>
</html>
